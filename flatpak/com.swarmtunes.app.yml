app-id: com.swarmtunes.app

runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk

command: swarmtunes

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
  - org.freedesktop.Sdk.Extension.rust-stable

build-options:
  append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin

finish-args:
  # Network access for the music/API backend
  - --share=network

  # Windowing
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

  # GPU acceleration
  - --device=dri

  # Audio
  - --socket=pulseaudio

modules:
  - name: swarmtunes
    buildsystem: simple

    build-options:
      env:
        HOME: /run/build/swarmtunes
        CARGO_HOME: /run/build/swarmtunes/cargo
        XDG_CACHE_HOME: /run/build/swarmtunes/cache
        npm_config_cache: /run/build/swarmtunes/cache/npm

    sources:
      - type: dir
        path: ..

      - cargo-sources.json
      - node-sources.json

    build-commands:
      # Configure Cargo to use the vendored crates.
      - |
        mkdir -p src-tauri/.cargo
        cat > src-tauri/.cargo/config.toml <<'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "/run/build/swarmtunes/cargo/vendor"
        EOF

      # Install npm dependencies entirely from the generated cache.
      - npm install --offline

      # Build the frontend + Tauri application.
      - npm run tauri build -- --no-bundle

      # Install the executable.
      - install -Dm755 src-tauri/target/release/swarmtunes /app/bin/swarmtunes

      # Desktop entry.
      - install -Dm644 flatpak/com.swarmtunes.app.desktop /app/share/applications/com.swarmtunes.app.desktop

      # AppStream metadata.
      - install -Dm644 flatpak/com.swarmtunes.app.metainfo.xml /app/share/metainfo/com.swarmtunes.app.metainfo.xml

      # Icon.
      - install -Dm644 flatpak/com.swarmtunes.app.png /app/share/icons/hicolor/512x512/apps/com.swarmtunes.app.png