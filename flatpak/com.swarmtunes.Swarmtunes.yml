id: com.swarmtunes.Swarmtunes

runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: swarmtunes

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
  - org.freedesktop.Sdk.Extension.rust-stable

build-options:
  append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network

modules:
  - name: swarmtunes
    buildsystem: simple

    build-commands:
      - npm ci
      - npm run tauri build -- --no-bundle

      - install -Dm755 src-tauri/target/release/swarmtunes /app/bin/swarmtunes
      - install -Dm644 flatpak/com.swarmtunes.Swarmtunes.desktop /app/share/applications/com.swarmtunes.Swarmtunes.desktop
      - install -Dm644 flatpak/com.swarmtunes.Swarmtunes.metainfo.xml /app/share/metainfo/com.swarmtunes.Swarmtunes.metainfo.xml

      - install -Dm644 public/icon.png /app/share/icons/hicolor/256x256/apps/com.swarmtunes.Swarmtunes.png
      - install -Dm644 LICENSE /app/share/licenses/$FLATPAK_ID/swarmtunes/LICENSE

    sources:
      - type: dir
        path: ..