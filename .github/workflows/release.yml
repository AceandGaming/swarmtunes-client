name: Release for Windows

on:
    push:
        tags:
            - "v*"

jobs:
    build:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
            - name: Build
              run: cargo build --release
